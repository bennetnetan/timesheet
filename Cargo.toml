[package]
name = "timesheet"
version = "0.17.4"
edition = "2024"

[dependencies]
eframe = { version = "0.33", default-features = true }
egui = "0.33"
egui_extras = { version = "0.33", features = ["datepicker", "serde"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
directories = "5"
rfd = "0.15"
csv = "1"
rust_xlsxwriter = "0.79"
printpdf = "0.7"
tray-icon = "0.26"
egui-material3 = "0.0.9"
